[project]
name = "astercli-py"
version = "0.1.0"
description = "AsterCLI Python 重写版（LangChain + LangGraph），与 Java 版并行演进"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.29",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.1",
    "prompt-toolkit>=3.0.48",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langchain>=1.4.3",
]

[project.scripts]
astercli = "astercli.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astercli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
